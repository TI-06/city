name: format-inspect

on:
  push:
    branches:
      - feat/map-storage-foundation

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/simulation/map/starter-map-generator.ts src/persistence/codec/world-map-codec.ts
          git diff -- src/simulation/map/starter-map-generator.ts src/persistence/codec/world-map-codec.ts
