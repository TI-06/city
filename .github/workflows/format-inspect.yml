name: format-inspect

on:
  push:
    branches:
      - feat/economy-core

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write             src/simulation/economy/economy-state.ts             src/persistence/codec/economy-codec.ts             src/simulation/economy/daily-economy-flow.ts             src/simulation/economy/daily-economy-system.ts             src/simulation/world/city-world-state.ts             src/persistence/codec/city-world-codec.ts             src/simulation/roads/build-road-command.ts             tests/unit/economy/economy-state.test.ts             tests/unit/persistence/economy-codec.test.ts             tests/unit/economy/daily-economy-flow.test.ts             tests/unit/economy/daily-economy-system.test.ts             tests/unit/persistence/city-world-codec.test.ts             tests/unit/roads/build-road-command.test.ts
          git diff --             src/simulation/economy/economy-state.ts             src/persistence/codec/economy-codec.ts             src/simulation/economy/daily-economy-flow.ts             src/simulation/economy/daily-economy-system.ts             src/simulation/world/city-world-state.ts             src/persistence/codec/city-world-codec.ts             src/simulation/roads/build-road-command.ts             tests/unit/economy/economy-state.test.ts             tests/unit/persistence/economy-codec.test.ts             tests/unit/economy/daily-economy-flow.test.ts             tests/unit/economy/daily-economy-system.test.ts             tests/unit/persistence/city-world-codec.test.ts             tests/unit/roads/build-road-command.test.ts
