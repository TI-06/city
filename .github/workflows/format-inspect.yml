name: format-inspect

on:
  push:
    branches:
      - feat/public-services-core

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show exact Prettier diff
        run: |
          npx prettier --write src/simulation/services/place-public-service-command.ts src/simulation/zoning/set-zone-command.ts
          git diff -- src/simulation/services/place-public-service-command.ts src/simulation/zoning/set-zone-command.ts
