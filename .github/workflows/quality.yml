name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - feat/foundation

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Normalize bootstrap files
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/foundation'
        run: |
          npm run format
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore: normalize foundation files and lock dependencies"
            git push
          fi

      - run: npm run verify

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - run: npx wrangler deploy --dry-run
